name: Generate plant page from Issue

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  generate:
    if: contains(github.event.issue.labels.*.name, 'plant')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate HTML from issue data
        id: generate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueBody = context.payload.issue.body;
            
            // Функция извлечения значения по заголовку (с эмодзи или без)
            function getValue(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(`###\\s*${escaped}\\s*\\n([\\s\\S]+?)(?=\\n###|\\n*$)`, 'i');
              const match = issueBody.match(regex);
              if (!match) return '';
              let value = match[1].trim();
              value = value.replace(/^[>\-\*]\s+/, '');
              return value;
            }
            
            const name = getValue('Название растения');
            const latin = getValue('Латинское название');
            const description = getValue('Краткое описание');
            const light = getValue('💡 Освещение') || getValue('Освещение');
            const water = getValue('💧 Полив') || getValue('Полив');
            const humidity = getValue('💨 Влажность воздуха') || getValue('Влажность воздуха');
            let funFact = getValue('🌿 Интересный факт') || getValue('Интересный факт');
            let care = getValue('📝 Подробный уход') || getValue('Подробный уход');
            
            if (!funFact) funFact = 'Нет интересных фактов';
            if (!care) care = 'Информация по уходу отсутствует';
            
            // Функция для преобразования Markdown-форматирования в HTML
            function formatText(text) {
              // Сначала заменяем переносы строк на <br>
              let formatted = text.replace(/\n/g, '<br>');
              // Жирный курсив *** ***
              formatted = formatted.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
              // Жирный ** **
              formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
              // Курсив * *
              formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
              return formatted;
            }
            
            care = formatText(care);
            funFact = formatText(funFact);
            
            const date = new Date().toLocaleDateString('ru-RU');
            
            // Создаём имя файла (slug) из названия растения
            let slug = name.toLowerCase()
              .replace(/[^a-zа-яё0-9\s]/gi, '')
              .replace(/\s+/g, '-')
              .replace(/-+/g, '-')
              .replace(/^-|-$/g, '');
            if (!slug) slug = 'plant';
            
            // Читаем шаблон
            const template = fs.readFileSync('template.html', 'utf8');
            let html = template
              .replace(/\{\{\s*name\s*\}\}/g, name)
              .replace(/\{\{\s*latin\s*\}\}/g, latin)
              .replace(/\{\{\s*description\s*\}\}/g, description)
              .replace(/\{\{\s*light\s*\}\}/g, light)
              .replace(/\{\{\s*water\s*\}\}/g, water)
              .replace(/\{\{\s*humidity\s*\}\}/g, humidity)
              .replace(/\{\{\s*fun_fact\s*\}\}/g, funFact)
              .replace(/\{\{\s*care\s*\}\}/g, care)
              .replace(/\{\{\s*date\s*\}\}/g, date);
            
            // Создаём папку plants и файл
            const dir = './plants';
            if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(`${dir}/${slug}.html`, html);
            
            core.setOutput('slug', slug);
            console.log(`Generated plants/${slug}.html`);

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add plants/
          git diff --quiet && git diff --staged --quiet || git commit -m "Generate page for ${{ steps.generate.outputs.slug }}"
          git push
